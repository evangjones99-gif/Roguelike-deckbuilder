<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#112b28" />
    <meta name="description" content="Lanternbound: an original folklore deckbuilding adventure. Summon woodland companions and guide them through a dangerous forest." />
    <title>Lanternbound — A woodland deckbuilding adventure</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar"></header>
      <div id="hud"></div>
      <main id="scene">
        <div id="arena-wrap" aria-hidden="true"><canvas id="arena"></canvas></div>
        <div id="scene-ui"></div>
      </main>
      <section id="dock" aria-label="Your hand"></section>
      <footer id="footer"></footer>
    </div>
    <div id="announcer" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
