name: Isolated unsigned Windows installer validation

on:
  workflow_dispatch:
  # Narrow bootstrap when reviewed workflow changes on the production branch.
  push:
    branches: [codex/lanternbound-production]
    paths:
      - .github/workflows/windows-installer-validation.yml
      - scripts/windows-installer-*.mjs

permissions:
  contents: read

concurrency:
  group: windows-installer-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-install-x64:
    if: >-
      github.repository == 'evangjones99-gif/Roguelike-deckbuilder' &&
      github.ref == 'refs/heads/codex/lanternbound-production' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 verified tag
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 verified tag
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install locked dependencies and stock Electron
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/electron/install.js
      - name: Rules and production build
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
      - name: Guard tests and prepare exact-source isolated installer
        run: |
          node --test scripts/windows-installer-guards.test.mjs scripts/windows-installer-transfer.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/windows-installer-current-validation.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/windows-installer-prepare.mjs
      - name: Build unsigned branded NSIS installer without publishing
        id: package
        run: |
          node node_modules/electron-builder/cli.js --win nsis --x64 --publish never --config build-installer/qa-config.json
      - name: Actual silent install, installed gameplay, persistence, feedback and guarded uninstall
        run: node scripts/windows-installer-smoke.mjs
      - name: Split exact original installer into bounded transfer parts
        if: always() && steps.package.outcome == 'success'
        run: node scripts/windows-installer-transfer.mjs
      - name: Retain small native evidence and transfer manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 verified tag
        with:
          name: hollowpact-isolated-installer-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reviews/windows-installer/
            build-installer/installer-transfer/manifest.json
            build-installer/qa-config.json
            build-installer/qa-only.nsh
            build-installer/request.json
            build-installer/builder-effective-config.yaml
            dist/build-provenance.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
      - name: Retain original installer part 01
        if: always() && hashFiles('build-installer/installer-transfer/part-01.bin') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 verified tag
        with:
          name: hollowpact-isolated-installer-part-01-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-installer/installer-transfer/part-01.bin
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Retain original installer part 02
        if: always() && hashFiles('build-installer/installer-transfer/part-02.bin') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 verified tag
