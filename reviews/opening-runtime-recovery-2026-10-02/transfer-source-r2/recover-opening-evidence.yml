name: Recover exact opening runtime bytes
on:
  push:
    branches: [codex/lanternbound-production]
    paths: [.github/workflows/recover-opening-evidence.yml]
  workflow_dispatch: {}
permissions: {}
jobs:
  transfer:
    if: >-
      github.repository == 'evangjones99-gif/Roguelike-deckbuilder' &&
      github.ref == 'refs/heads/codex/lanternbound-production' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.event.deleted == false))
