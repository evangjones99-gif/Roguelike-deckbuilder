    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Verify exactly fifty media bodies and two retained containers
        timeout-minutes: 4
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          GITHUB_TOKEN: ${{ github.token }}
