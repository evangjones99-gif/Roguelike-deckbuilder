        id: setup
        timeout-minutes: 2
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
          architecture: x64
          check-latest: false
          token: ''
      - name: Acquire exactly fifty canonical bodies and three original containers
        id: acquire
        timeout-minutes: 4
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          timeout --signal=TERM --kill-after=2s 178s python3 -I -B "$RUNNER_TEMP/empty-intent-fresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/control/runner.py" acquire
      - name: Assemble only the pinned runtime98 and support30 regular files
        id: assemble
        timeout-minutes: 2
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          timeout --signal=TERM --kill-after=2s 58s python3 -I -B "$RUNNER_TEMP/empty-intent-fresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/control/runner.py" assemble
      - name: Verify actual pinned Node and record npm platform versions
        id: preflight
        timeout-minutes: 1
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          timeout --signal=TERM --kill-after=2s 28s python3 -I -B "$RUNNER_TEMP/empty-intent-fresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/control/runner.py" preflight
      - name: Provision fresh locked dependencies without lifecycle scripts
        id: install
        timeout-minutes: 4
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          timeout --signal=TERM --kill-after=2s 178s python3 -I -B "$RUNNER_TEMP/empty-intent-fresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/control/runner.py" install
      - name: Build the original source under independent observed limits
        id: build
        timeout-minutes: 2
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          timeout --signal=TERM --kill-after=2s 58s python3 -I -B "$RUNNER_TEMP/empty-intent-fresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/control/runner.py" build
      - name: Run the eight original top level unit files separately
        id: test
        timeout-minutes: 2
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          timeout --signal=TERM --kill-after=2s 58s python3 -I -B "$RUNNER_TEMP/empty-intent-fresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/control/runner.py" test
      - name: Seal actual new output bytes and proof
        id: seal
        timeout-minutes: 1
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          timeout --signal=TERM --kill-after=2s 28s python3 -I -B "$RUNNER_TEMP/empty-intent-fresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/control/runner.py" seal
      - name: Upload only successfully sealed fresh dist and bounded proof
        if: success()
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: empty-intent-fresh-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/empty-intent-fresh-${{ github.run_id }}-${{ github.run_attempt }}/success-artifact/
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          retention-days: 30
      - name: Retain bounded failure diagnostics without deleting owned originals
        id: diagnostic
        if: failure()
        timeout-minutes: 1
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          fresh_root="$RUNNER_TEMP/empty-intent-fresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if timeout --signal=TERM --kill-after=2s 28s python3 -I -B "$fresh_root/control/runner.py" diagnose; then
            printf 'path=%s\n' "$fresh_root/failure-artifact" >> "$GITHUB_OUTPUT"
          else
            timeout --signal=TERM --kill-after=2s 8s python3 -I -B - <<'PY'
          import json, os, pathlib, re
          rid, attempt = os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"]
          assert re.fullmatch(r"[0-9]{1,20}",rid) and re.fullmatch(r"[0-9]{1,10}",attempt)
          temp=pathlib.Path(os.environ["RUNNER_TEMP"])
          assert temp.is_absolute() and temp.is_dir() and not temp.is_symlink()
          out=temp/("empty-intent-diagnostic-"+rid+"-"+attempt)
          out.mkdir(mode=0o700)
          with (out/"diagnostic-blocker.json").open("x") as f:
              json.dump({"status":"DIAGNOSTIC_ASSEMBLY_BLOCKED", "completeLogsUploaded":False, "originalsDeleted":False, "platformWorkflowLogs":"Retain independently; hosted lifetime external", "buildApproval":False},f)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("path="+str(out)+"\n")
          PY
          fi
      - name: Upload bounded failure diagnostic packet
        if: failure() && steps.diagnostic.outcome == 'success'
        timeout-minutes: 2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: empty-intent-fresh-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.diagnostic.outputs.path }}/
          if-no-files-found: error
          compression-level: 0
          overwrite: false
          include-hidden-files: false
          retention-days: 30
