Section "ServerFlags"
 Option "AutoAddDevices" "false"
 Option "DontVTSwitch" "true"
EndSection
Section "Device"
 Identifier "HollowpactVirtual"
 Driver "dummy"
 VideoRam 256000
EndSection
Section "Monitor"
 Identifier "HollowpactMonitor"
 HorizSync 28.0-80.0
 VertRefresh 48.0-75.0
EndSection
Section "Screen"
 Identifier "HollowpactScreen"
 Device "HollowpactVirtual"
 Monitor "HollowpactMonitor"
 DefaultDepth 24
 SubSection "Display"
  Depth 24
  Modes "1440x900" "1920x1080" "1024x768"
  Virtual 1920 1080
 EndSubSection
EndSection
